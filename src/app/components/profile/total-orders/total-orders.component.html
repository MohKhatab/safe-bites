<div class="overflow-x-auto">
  <h2 class="text-xl font-bold mb-4 text-gray-800">My Orders</h2>

  <div
    *ngIf="userOrders.length === 0 && !loading"
    class="flex items-center justify-center h-64 text-center text-gray-700 text-2xl font-bold">
    There is no orders yet!
  </div>

  <table
    *ngIf="userOrders.length > 0 && !loading"
    class="min-w-full border-gray-200 rounded-xl shadow-md">
    <thead class="bg-[#1b8057]">
      <tr>
        <th class="text-left py-5 px-4 text-md font-semibold text-white">#</th>
        <th class="text-left py-5 px-4 text-md font-semibold text-white">
          Total Products
        </th>
        <th class="text-left py-5 px-4 text-md font-semibold text-white">
          Date
        </th>
        <th class="text-left py-5 px-4 text-md font-semibold text-white">
          Total
        </th>
        <th class="text-left py-5 px-4 text-md font-semibold text-white">
          Status
        </th>
      </tr>
    </thead>
    <tbody>
      <tr
        *ngFor="let order of userOrders; let i = index"
        class="hover:bg-gray-200 cursor-pointer transition duration-200 border-b">
        <td class="py-4 px-4 text-md text-gray-600">{{ i + 1 }}</td>
        <td class="py-4 px-4 text-md font-medium text-gray-800">
          {{ order.products.length }}
        </td>
        <td class="py-4 px-4 text-md text-gray-600">
          {{ formatDate(order.createdAt) }}
        </td>
        <td class="py-4 px-4 text-md text-gray-600">
          {{ order.totalPrice | currency }}
        </td>
        <td class="py-4 px-4 text-md">
          <span
            [ngClass]="{
              'bg-green-100 text-green-700': order.status === 'Delivered',
              'bg-yellow-100 text-yellow-700': order.status === 'Pending',
              'bg-red-100 text-red-700': order.status === 'Cancelled',
            }"
            class="px-2 py-2 rounded-full text-sm font-semibold">
            {{ order.status }}
          </span>
        </td>
      </tr>
    </tbody>
  </table>
</div>
